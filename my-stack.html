<!-- ═══════════════════════════  SCRIPTS  ═══════════════════════════ -->
<script>
// ─── State ───────────────────────────────────────────────────────────────────
let stack = [];           // Array of entry objects
let spotSilver = null;    // $/oz
let spotGold   = null;    // $/oz
let currentUser = null;

// ─── Storage helpers ──────────────────────────────────────────────────────────
function storageKey() {
  return currentUser ? 'shinyy_stack_' + currentUser.email : 'shinyy_stack_guest';
}
function loadStack() {
  try {
    var raw = JSON.parse(localStorage.getItem(storageKey()) || '[]');
    // Migration: if stored as object with numeric keys (corrupted), convert back to array and re-save
    if (!Array.isArray(raw) && raw && typeof raw === 'object') {
      raw = Object.values(raw);
      localStorage.setItem(storageKey(), JSON.stringify(raw));
    }
    stack = raw;
  }
  catch(e) { stack = []; }
}
// ─── Auth token helper ────────────────────────────────────────────────────
  function getAuthToken(user, cb) {
    if (!user) return;
    var tok = user.token && user.token.access_token;
    if (!tok) return;
    try {
      var exp = JSON.parse(atob(tok.split('.')[1])).exp * 1000;
      if (Date.now() < exp - 10000) { cb(tok); return; }
    } catch(e) {}
    netlifyIdentity.refresh()
      .then(function(t) { if (t) cb(t); })
      .catch(function() { cb(tok); });
  }

  // ─── Server sync ────────────────────────────────────────────────────────────────────
  function syncStackFromServer(user) {
    if (!user) return;
    getAuthToken(user, function(token) {
      fetch('/api/stack', { headers: {'Authorization': 'Bearer ' + token} })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(serverData) {
          var guestStack = JSON.parse(localStorage.getItem('shinyy_stack_guest') || '[]');
          loadStack();
          var serverArr = Array.isArray(serverData) ? serverData : [];
          var localIds = {};
          stack.forEach(function(e) { localIds[e.id] = true; });
          var merged = stack.slice();
          serverArr.forEach(function(e) { if (!localIds[e.id]) merged.push(e); });
          if (guestStack.length) {
            var mergedIds = {};
            merged.forEach(function(e) { mergedIds[e.id] = true; });
            guestStack.forEach(function(e) { if (!mergedIds[e.id]) merged.push(e); });
            localStorage.removeItem('shinyy_stack_guest');
          }
          stack = merged;
          saveStack();
          renderAll();
        })
        .catch(function() {
          var guestStack = JSON.parse(localStorage.getItem('shinyy_stack_guest') || '[]');
          loadStack();
          if (guestStack.length) {
            stack = guestStack.concat(stack);
            saveStack();
            localStorage.removeItem('shinyy_stack_guest');
          }
          renderAll();
        });
    });
  }

  function saveStack() {
  localStorage.setItem(storageKey(), JSON.stringify(stack));
  if (currentUser) {
    getAuthToken(currentUser, function(token) {
      fetch('/api/stack', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
        body: JSON.stringify(stack)
      }).catch(function() {});
    });
  }
}

// ─── Netlify Identity ──────────────────────────────────────────────────────────
if (window.netlifyIdentity) {
  netlifyIdentity.on('init', function(user) {
    currentUser = user;
    updateAuthUI(user);
    loadStack();
    renderAll();
  });
  netlifyIdentity.on('login', function(user) {
    currentUser = user;
    updateAuthUI(user);
    netlifyIdentity.close();
    syncStackFromServer(user);
  });
  netlifyIdentity.on('logout', function() {
    currentUser = null;
    updateAuthUI(null);
    loadStack();
    renderAll();
  });
}
function updateAuthUI(user) {
  var btn = document.getElementById('loginBtn');
  var disp = document.getElementById('userDisplay');
  if (user) {
    btn.classList.add('hidden');
    disp.classList.remove('hidden');
    var name = (user.user_metadata && user.user_metadata.full_name) || user.email.split('@')[0];
    disp.textContent = '👤 ' + name;
    disp.onclick = function() { netlifyIdentity.open('account'); };
  } else {
    btn.classList.remove('hidden');
    disp.classList.add('hidden');
  }
}

// ─── Spot price fetch ──────────────────────────────────────────────────────────
async function fetchSpot() {
  let spotSrc = '';
  // Source 1: Kitco REST proxy — returns both AG (silver) and AU (gold)
  try {
    const r = await fetch('https://www.kitco.com/api/kitco-rest-proxy/precious-metals', { cache: 'no-store' });
    const d = await r.json();
    const pm = d?.PreciousMetals?.PM || [];
    const ag = pm.find(m => m.Symbol === 'AG');
    const au = pm.find(m => m.Symbol === 'AU');
    if (ag) spotSilver = parseFloat(ag.current_bid);
    if (au) spotGold   = parseFloat(au.current_bid);
    if (spotSilver || spotGold) spotSrc = 'kitco';
  } catch {}

  // Silver fallback: Fawaz open currency API
  if (!spotSilver || spotSilver < 5 || spotSilver > 500) {
    try {
      const r2 = await fetch('https://latest.currency-api.pages.dev/v1/currencies/xag.json', { cache: 'no-store' });
      const d2 = await r2.json();
      const p = d2?.xag?.usd;
      if (p) { spotSilver = parseFloat(p); spotSrc = spotSrc || 'fawaz'; }
    } catch {}
  }

  // Gold fallback: estimate from cheapest 1oz gold deal minus premium
  if (!spotGold) {
    try {
      const r3 = await fetch('/.netlify/functions/get-prices');
      const d3 = await r3.json();
      const g1oz = (d3.gold || []).filter(x => x.oz === 1).sort((a,b) => a.price - b.price)[0];
      if (g1oz) { spotGold = g1oz.price - g1oz.prem; spotSrc = spotSrc || 'cache'; }
    } catch {}
  }

  const status = document.getElementById('spotStatus');
  if (spotSilver && spotGold) {
    status.textContent = `Ag $${spotSilver.toFixed(2)}/oz · Au $${spotGold.toFixed(0)}/oz · via ${spotSrc}`;
    status.className = status.className.replace(/text-yellow-\d+/g, '') + ' text-indigo-200';
  } else {
    status.textContent = '⚠ Spot price unavailable — values estimated';
    status.className = status.className.replace(/text-indigo-\d+/g, '') + ' text-yellow-300';
  }
  renderSummary();
}

// ─── Rendering ────────────────────────────────────────────────────────────────
function renderAll() {
  renderTable();
  renderSummary();
}

function fmt(n, decimals) {
  if (decimals === undefined) decimals = 2;
  if (n == null || isNaN(n)) return '—';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtOz(n) {
  if (n == null || isNaN(n)) return '0.000';
  return n.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
}
function fmtDate(d) {
  if (!d) return '—';
  var parts = d.split('-');
  return parts[1] + '/' + parts[2] + '/' + parts[0];
}
function glClass(n) { return n >= 0 ? 'gain' : 'loss'; }
function glSign(n)  { return n >= 0 ? '+' : ''; }

function renderTable() {
  var tbody = document.getElementById('stackTable');
  var empty = document.getElementById('emptyState');
  var count = document.getElementById('entryCount');
  count.textContent = stack.length + ' entr' + (stack.length === 1 ? 'y' : 'ies');

  if (!stack.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  tbody.innerHTML = stack.map(function(e, i) {
    var perOz = e.totalPaid / e.weightOz;
    var spot  = e.metal === 'silver' ? spotSilver : spotGold;
    var curr  = spot ? spot * e.weightOz : null;
    var gl    = curr != null ? curr - e.totalPaid : null;
    var glPct = gl != null && e.totalPaid ? (gl / e.totalPaid * 100) : null;
    var badge = e.metal === 'silver'
      ? '<span class="badge-silver px-2 py-0.5 rounded-full text-xs font-semibold">🥈 Ag<\/span>'
      : '<span class="badge-gold px-2 py-0.5 rounded-full text-xs font-semibold">🥇 Au<\/span>';
    var glCell = gl != null
      ? '<span class="' + glClass(gl) + '">' + glSign(gl) + fmt(gl) + ' <span class="text-xs">(' + glSign(glPct) + glPct.toFixed(1) + '%)<\/span><\/span>'
      : '<span class="text-gray-300">—<\/span>';
    var valCell = curr != null ? fmt(curr) : '<span class="text-gray-300">—<\/span>';

    return '<tr class="border-t border-gray-50 transition-colors" data-id="' + e.id + '">'
      + '<td class="px-4 py-3">' + badge + '<\/td>'
      + '<td class="px-4 py-3 font-medium text-gray-800 max-w-xs">' + e.name
      + (e.notes ? '<div class="text-xs text-gray-400 mt-0.5">' + e.notes + '<\/div>' : '')
      + '<\/td>'
      + '<td class="px-4 py-3 text-gray-600">' + (e.whereBought || '<span class="text-gray-300">—<\/span>') + '<\/td>'
      + '<td class="px-4 py-3 text-right font-mono text-gray-700">' + fmtOz(e.weightOz) + '<\/td>'
      + '<td class="px-4 py-3 text-right font-mono text-gray-700">' + fmt(e.totalPaid) + '<\/td>'
      + '<td class="px-4 py-3 text-right font-mono text-gray-600">' + fmt(perOz) + '<\/td>'
      + '<td class="px-4 py-3 text-gray-500 text-xs">' + fmtDate(e.date) + '<\/td>'
      + '<td class="px-4 py-3 text-right font-mono text-gray-700">' + valCell + '<\/td>'
      + '<td class="px-4 py-3 text-right font-semibold">' + glCell + '<\/td>'
      + '<td class="px-4 py-3 text-right"><div class="flex items-center justify-end gap-1">'
      + '<button onclick="editEntry(' + i + ')" class="edit-btn p-1.5 rounded-lg text-gray-400 transition-colors text-xs">✏️<\/button>'
      + '<button onclick="deleteEntry(' + i + ')" class="delete-btn p-1.5 rounded-lg text-gray-400 transition-colors text-xs">🗑<\/button>'
      + '<\/div><\/td>'
      + '<\/tr>';
  }).join('');
}

function renderSummary() {
  // Silver
  var silverEntries = stack.filter(function(e) { return e.metal === 'silver'; });
  var silverOz   = silverEntries.reduce(function(s, e) { return s + e.weightOz; }, 0);
  var silverCost = silverEntries.reduce(function(s, e) { return s + e.totalPaid; }, 0);
  var silverDCA  = silverOz > 0 ? silverCost / silverOz : null;
  var silverVal  = spotSilver && silverOz > 0 ? spotSilver * silverOz : null;
  var silverGL   = silverVal != null ? silverVal - silverCost : null;
  var silverGLPct= silverGL != null && silverCost > 0 ? silverGL / silverCost * 100 : null;

  document.getElementById('silverOz').textContent  = fmtOz(silverOz) + ' oz';
  document.getElementById('silverDCA').textContent = silverDCA != null ? fmt(silverDCA) + '/oz' : '—';
  document.getElementById('silverCost').textContent= fmt(silverCost);
  document.getElementById('silverValue').textContent = silverVal != null ? fmt(silverVal) : '—';
  var sgl = document.getElementById('silverGL');
  if (silverGL != null) {
    sgl.textContent = glSign(silverGL) + fmt(silverGL) + (silverGLPct != null ? ' (' + glSign(silverGLPct) + silverGLPct.toFixed(1) + '%)' : '');
    sgl.className = 'font-semibold ' + glClass(silverGL);
  } else { sgl.textContent = '—'; sgl.className = 'font-semibold text-gray-400'; }

  // Gold
  var goldEntries = stack.filter(function(e) { return e.metal === 'gold'; });
  var goldOz   = goldEntries.reduce(function(s, e) { return s + e.weightOz; }, 0);
  var goldCost = goldEntries.reduce(function(s, e) { return s + e.totalPaid; }, 0);
  var goldDCA  = goldOz > 0 ? goldCost / goldOz : null;
  var goldVal  = spotGold && goldOz > 0 ? spotGold * goldOz : null;
  var goldGL   = goldVal != null ? goldVal - goldCost : null;
  var goldGLPct= goldGL != null && goldCost > 0 ? goldGL / goldCost * 100 : null;

  document.getElementById('goldOz').textContent  = fmtOz(goldOz) + ' oz';
  document.getElementById('goldDCA').textContent = goldDCA != null ? fmt(goldDCA) + '/oz' : '—';
  document.getElementById('goldCost').textContent= fmt(goldCost);
  document.getElementById('goldValue').textContent = goldVal != null ? fmt(goldVal) : '—';
  var ggl = document.getElementById('goldGL');
  if (goldGL != null) {
    ggl.textContent = glSign(goldGL) + fmt(goldGL) + (goldGLPct != null ? ' (' + glSign(goldGLPct) + goldGLPct.toFixed(1) + '%)' : '');
    ggl.className = 'font-semibold ' + glClass(goldGL);
  } else { ggl.textContent = '—'; ggl.className = 'font-semibold text-gray-400'; }

  // Total
  var totalCost = silverCost + goldCost;
  var totalVal  = (silverVal || 0) + (goldVal || 0);
  var totalValReal = (silverVal != null || goldVal != null) ? totalVal : null;
  var totalGL   = totalValReal != null ? totalValReal - totalCost : null;
  var totalGLPct= totalGL != null && totalCost > 0 ? totalGL / totalCost * 100 : null;

  document.getElementById('totalValue').textContent = totalValReal != null ? fmt(totalValReal) : fmt(totalCost);
  document.getElementById('totalCost').textContent = fmt(totalCost);
  var tgl = document.getElementById('totalGL');
  if (totalGL != null) {
    tgl.textContent = glSign(totalGL) + fmt(totalGL);
    tgl.className = 'font-semibold ' + (totalGL >= 0 ? 'text-green-300' : 'text-red-300');
  } else { tgl.textContent = '—'; tgl.className = 'font-semibold text-indigo-200'; }
  var tr = document.getElementById('totalReturn');
  if (totalGLPct != null) {
    tr.textContent = glSign(totalGLPct) + totalGLPct.toFixed(2) + '%';
    tr.className = 'font-semibold ' + (totalGLPct >= 0 ? 'text-green-300' : 'text-red-300');
  } else { tr.textContent = '—'; tr.className = 'font-semibold text-indigo-200'; }
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal(entry) {
  entry = entry || null;
  var modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = entry ? 'Edit Entry' : 'Add Entry';
  document.getElementById('editId').value = entry ? entry.id : '';
  document.getElementById('itemName').value    = entry ? entry.name : '';
  document.getElementById('whereBought').value = entry ? (entry.whereBought || '') : '';
  document.getElementById('weightOz').value    = entry ? entry.weightOz : '';
  document.getElementById('totalPaid').value   = entry ? entry.totalPaid : '';
  document.getElementById('purchaseDate').value= entry ? (entry.date || '') : new Date().toISOString().slice(0,10);
  document.getElementById('notes').value       = entry ? (entry.notes || '') : '';
  setMetal(entry ? entry.metal : 'silver');
  updateModalCalc();
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  setTimeout(function() { document.getElementById('itemName').focus(); }, 100);
}
function closeModal() {
  var modal = document.getElementById('modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeModal(); });

function setMetal(metal) {
  document.getElementById('metalInput').value = metal;
  var bs = document.getElementById('btnSilver');
  var bg = document.getElementById('btnGold');
  if (metal === 'silver') {
    bs.className = 'flex-1 py-2 rounded-xl text-sm font-semibold border-2 border-indigo-600 bg-indigo-600 text-white transition-all';
    bg.className = 'flex-1 py-2 rounded-xl text-sm font-semibold border-2 border-gray-200 text-gray-500 transition-all hover:border-yellow-400';
  } else {
    bg.className = 'flex-1 py-2 rounded-xl text-sm font-semibold border-2 border-yellow-400 bg-yellow-400 text-yellow-900 transition-all';
    bs.className = 'flex-1 py-2 rounded-xl text-sm font-semibold border-2 border-gray-200 text-gray-500 transition-all hover:border-indigo-400';
  }
}

function updateModalCalc() {
  var w = parseFloat(document.getElementById('weightOz').value);
  var p = parseFloat(document.getElementById('totalPaid').value);
  var preview = document.getElementById('calcPreview');
  if (w > 0 && p > 0) {
    document.getElementById('calcPerOz').textContent = fmt(p / w) + '/oz';
    preview.classList.remove('hidden');
  } else {
    preview.classList.add('hidden');
  }
}

function saveEntry(e) {
  e.preventDefault();
  var editId = document.getElementById('editId').value;
  var entry = {
    id: editId || Date.now().toString(),
    metal: document.getElementById('metalInput').value,
    name: document.getElementById('itemName').value.trim(),
    whereBought: document.getElementById('whereBought').value.trim(),
    weightOz: parseFloat(document.getElementById('weightOz').value),
    totalPaid: parseFloat(document.getElementById('totalPaid').value),
    date: document.getElementById('purchaseDate').value,
    notes: document.getElementById('notes').value.trim(),
  };
  if (editId) {
    var idx = stack.findIndex(function(s) { return s.id === editId; });
    if (idx !== -1) stack[idx] = entry; else stack.push(entry);
  } else {
    stack.push(entry);
  }
  saveStack();
  closeModal();
  renderAll();
}

function editEntry(i) { openModal(stack[i]); }

function deleteEntry(i) {
  if (!confirm('Delete "' + stack[i].name + '"?')) return;
  stack.splice(i, 1);
  saveStack();
  renderAll();
}

function clearAll() {
  stack = [];
  saveStack();
  renderAll();
}

// ─── Export CSV ───────────────────────────────────────────────────────────────
function exportCSV() {
  var headers = ['Metal','Item','Where Bought','Weight (oz)','Total Paid','$/oz Paid','Date','Notes'];
  var rows = stack.map(function(e) { return [
    e.metal, e.name, e.whereBought, e.weightOz, e.totalPaid,
    (e.totalPaid / e.weightOz).toFixed(4), e.date, e.notes
  ]; });
  var csv = [headers].concat(rows).map(function(r) { return r.map(function(c) { return '"' + String(c||'').replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'my-stack-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// ─── Keyboard shortcut ────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'n' && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) openModal();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
loadStack();
renderAll();
fetchSpot();
// Refresh spot every 5 minutes
setInterval(fetchSpot, 5 * 60 * 1000);
</script>
